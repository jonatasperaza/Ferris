[package]
name = "ferris-compositor"
version = "0.1.0"
edition = "2021"

[dependencies]
winit = "0.30"
wgpu = "22"
glyphon = "0.6"
bytemuck = { version = "1.16", features = ["derive"] }
pollster = "0.3"
log = "0.4"
env_logger = "0.11"
ferris-dom = { path = "../ferris-dom" }
ferris-css = { path = "../ferris-css" }
ferris-style = { path = "../ferris-style" }
ferris-layout = { path = "../ferris-layout" }
ferris-paint = { path = "../ferris-paint" }
ferris-scene = { path = "../ferris-scene" }
ferris-loader = { path = "../ferris-loader" }
